
<body class="min-h-screen">
   <router-outlet>
    <header class="nav-bar">
        <h1 class="site-title">
          <a (click)="homepage()">Spark Connections</a>
        </h1>
        @if(accountServices.currentUser){
           <div class="button-container">
            <button class="home-btn"  [routerLink]="['match']">Match</button>
            <button class="home-btn"  [routerLink]="['list']">List</button>
            <button class="home-btn"  [routerLink]="['message']">Message</button>
          </div>
       <div class="user-container">
        <div class="dropdown">
            <img [src]="accountServices.currentUser?.imageUrl || '/profile.jpg'" alt="User Image" class="user-image">
            <div class="dropdown-content">
                <a (click)=toProfile()>Profile</a>
                <a (click)="logout()">Logout</a>
            </div>
        </div>
        <span class="user-name">{{accountServices.currentUser.displayName}}</span>
    </div>
        }@else{
        <div class="auth-buttons">
            <button class="auth-btn sign-in" [routerLink]="['signin']">Sign In</button>
            <button class="auth-btn sign-up" [routerLink]="['signup']">Sign Up</button>
        </div>
      }
    </header>
     </router-outlet>
   @if(router.url=='/'){
       <section class="welcome-section">
        <h2 class="welcome-title">Welcome to Spark Connections</h2>
        <p class="welcome-subtitle">Find you match❤️</p>
    </section>
  }
</body>
