<body>
    <section class="signin-section">
        <h2 class="signin-title">Sign In to Splitwise</h2>
        <p class="signin-subtitle">Access your account to manage your expenses.</p>
        <form class="signin-form">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" [(ngModel)] = "loginForm.email" class="form-input" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" [(ngModel)] = "loginForm.password" class="form-input" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-btn" (click)="signin()">Sign In</button>
        </form>
        <p class="forgot-password">
            <a href="#" class="forgot-link">Forgot your password?</a>
        </p>
    </section>
</body>
